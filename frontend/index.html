<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>棉卫士 · 湖南省棉花病虫害智能监测预测系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050a1a;--card:rgba(6,14,36,0.92);--cyan:#00d4ff;--magenta:#ff2d78;--green:#2ed573;--amber:#ff9f43;--red:#ff4757;--text:#e0e8f0;--dim:rgba(140,170,210,0.5);--fs:1.2;--shadow:0 2px 16px rgba(0,0,0,0.35)}
html,body{height:100%;overflow:hidden;font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text)}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(0,212,255,0.02) 39px,rgba(0,212,255,0.02) 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(0,212,255,0.02) 39px,rgba(0,212,255,0.02) 40px)}
.header{height:86px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(0,212,255,0.1);background:linear-gradient(180deg,rgba(0,212,255,0.04) 0%,transparent 100%);flex-shrink:0}
.header h1{font-size:38px;font-weight:700;background:linear-gradient(135deg,#e0e8f0 0%,var(--cyan) 40%,var(--magenta) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.main-grid{display:grid;grid-template-columns:400px 1fr 400px;height:calc(100vh - 86px);overflow:hidden}
.col-left,.col-right{display:flex;flex-direction:column;gap:10px;padding:10px;overflow-y:auto;overflow-x:hidden;height:100%}
.col-left{background:rgba(0,0,0,0.15)}
.col-map{position:relative;overflow:hidden}#mapContainer{width:100%;height:100%}
.panel{border-radius:8px;background:var(--card);border:1px solid rgba(0,180,255,0.1);box-shadow:var(--shadow);flex-shrink:0}
.ptitle{font-size:22px;color:var(--dim);letter-spacing:1px;padding:10px 10px 6px;display:flex;align-items:center;gap:4px}
.ptitle::before{content:'';width:2px;height:10px;background:linear-gradient(180deg,var(--cyan),var(--magenta));border-radius:1px}
.pbody{padding:0 10px 10px}
.micro-row{display:flex;gap:6px}.micro-cell{flex:1;text-align:center;padding:6px 2px;background:rgba(0,212,255,0.03);border-radius:5px;border:1px solid rgba(0,212,255,0.06)}
.micro-cell .val{font-size:38px;font-weight:700;font-family:JetBrains Mono,Cascadia Code,Fira Code,Consolas,monospace;letter-spacing:0.5px}
.micro-cell .lbl{font-size:20px;color:var(--dim);margin-top:2px}
.micro-cell .val.cyan{color:var(--cyan)}.micro-cell .val.green{color:var(--green)}.micro-cell .val.amber{color:var(--amber)}
.wl-row{display:flex;gap:6px;padding:6px 10px 10px}.wl-cell{flex:1;text-align:center;padding:6px 0;background:rgba(0,212,255,0.02);border-radius:4px}
.wl-cell .num{font-size:36px;font-weight:700;font-family:JetBrains Mono,Cascadia Code,Fira Code,Consolas,monospace}
.wl-cell .lbl{font-size:20px;color:var(--dim);margin-top:1px}
.wl-cell.green .num{color:var(--green)}.wl-cell.amber .num{color:var(--amber)}.wl-cell.red .num{color:var(--red)}
.mon-list{max-height:200px;overflow-y:auto}.mon-item{display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:15px;color:var(--dim);border-radius:4px;transition:background .2s}.mon-item:hover{background:rgba(0,212,255,0.06)}
.mon-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.mon-dot.on{background:var(--green)}.mon-dot.off{background:var(--dim)}
.mon-name{flex:1;color:var(--text)}.mon-time{font-size:18px;color:rgba(140,170,210,0.3)}
.top3-list{padding:0 10px 4px}.top3-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;color:var(--dim);border-radius:4px;transition:background .2s}.top3-item:hover{background:rgba(0,212,255,0.06)}
.top3-rank{font-weight:700;width:20px;text-align:center;font-size:14px;color:var(--cyan)}
.top3-rank.gold{color:#ffd700}.top3-rank.silver{color:#c0c0c0}.top3-rank.bronze{color:#cd7f32}
.top3-name{flex:1;color:var(--text);font-weight:600}.top3-rate{font-size:24px;color:var(--amber);font-weight:700;font-family:JetBrains Mono,Cascadia Code,Fira Code,Consolas,monospace;margin-right:3px}
.top3-pest{font-size:18px;color:var(--dim);padding:1px 5px;border-radius:3px;background:rgba(0,212,255,0.06)}
.rec-box{background:rgba(0,212,255,0.04);border:1px solid rgba(0,212,255,0.08);border-radius:4px;padding:5px 8px;margin:0 10px 8px}
.rec-text{font-size:22px;color:var(--text);line-height:1.5}.rec-text .hl{color:var(--amber);font-weight:700}.rec-text .hl2{color:var(--magenta);font-weight:700}
.env-item{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid rgba(0,212,255,0.03)}
.env-item .lbl{font-size:22px;color:var(--dim)}.env-item .val{font-size:32px;font-weight:700;font-family:JetBrains Mono,Cascadia Code,Fira Code,Consolas,monospace}
.env-item .val.cyan{color:var(--cyan)}.env-item .val.green{color:var(--green)}.env-item .val.magenta{color:var(--magenta)}
.env-item .unit{font-size:18px;color:var(--dim);margin-left:2px}
.kpi-row{display:flex;gap:8px;padding:6px 10px 10px}.kpi-cell{flex:1;text-align:center;padding:10px 4px;background:rgba(0,212,255,0.03);border-radius:5px;border:1px solid rgba(0,212,255,0.06)}
.kpi-cell .val{font-size:42px;font-weight:700;font-family:JetBrains Mono,Cascadia Code,Fira Code,Consolas,monospace}
.kpi-cell .lbl{font-size:20px;color:var(--dim);margin-top:3px}
.kpi-cell .val.cyan{color:var(--cyan)}.kpi-cell .val.amber{color:var(--amber)}
.chart-box{width:100%}.sc{width:100%;height:170px}.hc{width:100%;height:110px}.pc{width:100%;height:110px}
.current-area{font-size:24px;font-weight:700;color:var(--text);padding:4px 10px 0;cursor:pointer}.current-area:hover{color:var(--cyan)}
#rightPanelB .warn-list{overflow-y:auto;max-height:240px}.warn-item{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:15px;color:var(--dim);border-radius:4px;transition:background .2s}.warn-item:hover{background:rgba(0,212,255,0.06)}
.warn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}.warn-dot.red{background:var(--red);box-shadow:0 0 3px var(--red)}
.warn-dot.amber{background:var(--amber);box-shadow:0 0 3px var(--amber)}
.warn-time{font-size:18px;color:rgba(140,170,210,0.4);font-family:JetBrains Mono,Cascadia Code,Fira Code,Consolas,monospace;white-space:nowrap}
.warn-area{font-weight:600;color:var(--text)}.warn-info{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,26,0.85);z-index:200;gap:10px;font-size:16px;color:var(--dim)}
.spinner{width:36px;height:36px;border:3px solid rgba(0,212,255,0.08);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.controls{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:4px;background:rgba(6,14,36,0.85);padding:4px;border-radius:8px;border:1px solid rgba(0,212,255,0.12)}
.pill{padding:8px 22px;border:none;border-radius:6px;background:transparent;color:var(--dim);font-size:15px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .2s}
.pill:hover{color:var(--text);background:rgba(255,255,255,0.04)}.pill.active{background:rgba(0,212,255,0.12);color:var(--cyan)}
.map-legend{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:100;background:rgba(6,14,36,0.85);border-radius:6px;padding:4px 12px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);border:1px solid rgba(0,212,255,0.08)}
.map-legend .bar{width:80px;height:6px;border-radius:3px;background:linear-gradient(90deg,#0a4b33,#2d8a4e,#e6a817,#d95a11,#b71c1c)}
.map-legend .leg-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.photo-card{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);z-index:150;width:260px;border-radius:8px;padding:10px;background:var(--card);border:1px solid rgba(0,212,255,0.15);display:none}
.photo-card .ph-img{width:100%;height:100px;background:rgba(0,212,255,0.03);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--dim)}
.photo-card .ph-lbl{font-size:11px;color:var(--dim);margin-top:4px;text-align:center}
.ph-close{position:absolute;top:5px;right:7px;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;opacity:0.6}
.mini-gauge{display:inline-block;width:44px;height:44px;vertical-align:middle;margin-left:4px}
.overview-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}.overview-row .micro-row{flex:1;margin-bottom:0}
.footer{position:fixed;bottom:4px;left:50%;transform:translateX(-50%);z-index:50;font-size:11px;color:rgba(140,170,210,0.2);pointer-events:none}
.col-left::-webkit-scrollbar,.col-right::-webkit-scrollbar,.mon-list::-webkit-scrollbar,.warn-list::-webkit-scrollbar{width:3px}
.col-left::-webkit-scrollbar-track,.col-right::-webkit-scrollbar-track,.mon-list::-webkit-scrollbar-track,.warn-list::-webkit-scrollbar-track{background:transparent}
.col-left::-webkit-scrollbar-thumb,.col-right::-webkit-scrollbar-thumb,.mon-list::-webkit-scrollbar-thumb,.warn-list::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.2);border-radius:2px}
</style>
</head>
<body>
<div class="header"><h1>棉卫士 · 湖南省棉花病虫害智能监测预测系统</h1></div>
<div class="main-grid">
<div class="col-left">
<div class="panel" id="panelA">
<div class="ptitle">监测状态</div>
<div class="overview-row" style="padding:0 10px"><div class="micro-row">
<div class="micro-cell"><div class="val cyan"><span id="microTotal">--</span></div><div class="lbl">监测点</div></div>
<div class="micro-cell"><div class="val green"><span id="microOnline">--</span></div><div class="lbl">在线</div></div>
<div class="micro-cell"><div style="color:var(--dim);font-size:17px;font-weight:700;font-family:JetBrains Mono"><span id="microOffline">--</span></div><div class="lbl">离线</div></div>
<div class="micro-cell"><div class="val amber"><span id="microWarn">--</span></div><div class="lbl">预警</div></div>
</div><canvas id="mgCanvas" class="mini-gauge" width="44" height="44"></canvas></div>
<div class="wl-row" id="warnLevels">
<div class="wl-cell green"><div class="num">--</div><div class="lbl">一般</div></div>
<div class="wl-cell amber"><div class="num">--</div><div class="lbl">较重</div></div>
<div class="wl-cell red"><div class="num">--</div><div class="lbl">严重</div></div>
</div>
<div class="ptitle">监测点状态</div>
<div class="mon-list" id="monList"><div class="mon-item"><div class="mon-dot on"></div><span class="mon-name">加载中...</span><span class="mon-time"></span></div></div>
<div class="ptitle">重点关注区域 Top3</div>
<div class="top3-list" id="top3List"><div class="top3-item"><span class="top3-rank" style="color:var(--dim)">--</span><span class="top3-name">加载中...</span></div></div>
<div class="ptitle">防治建议</div>
<div class="rec-box"><div class="rec-text" id="recText">数据加载中...</div></div>
</div>
<div class="panel" id="panelB">
<div class="ptitle">环境参数</div>
<div class="env-item"><span class="lbl">平均气温</span><span class="val cyan"><span id="infoTemp">--</span><span class="unit">°C</span></span></div>
<div class="env-item"><span class="lbl">平均湿度</span><span class="val green"><span id="infoHum">--</span><span class="unit">%</span></span></div>
<div class="env-item"><span class="lbl">经度</span><span class="val magenta"><span id="infoLng">--</span></span></div>
<div class="env-item"><span class="lbl">纬度</span><span class="val magenta"><span id="infoLat">--</span></span></div>
</div>
</div>
<div class="col-map">
<div class="loading-overlay" id="loading"><div class="spinner"></div><span>系统初始化中...</span></div>
<div id="mapContainer"></div>
<div class="controls" id="timeGroup"><button class="pill active" data-range="1d">近1天</button><button class="pill" data-range="3d">近3天</button><button class="pill" data-range="7d">近1周</button></div>
<div class="map-legend"><span style="font-size:11px">虫害发生率</span><div class="bar"></div><span style="font-size:11px">低</span><span style="font-size:11px">高</span><span style="opacity:0.3">|</span><span class="leg-dot" style="background:#ff2d78"></span><span style="font-size:11px">有虫害</span><span class="leg-dot" style="background:rgba(0,212,255,0.5)"></span><span style="font-size:11px">无虫害</span></div>
</div>
<div class="col-right">
<div class="panel" id="rightPanelA" style="height:180px;overflow:hidden">
<div class="ptitle">虫情统计</div>
<div class="current-area" id="currentArea">当前查看：湖南省</div>
<div class="kpi-row"><div class="kpi-cell"><div class="val cyan"><span id="kpiRate">--</span><span style="font-size:13px">%</span></div><div class="lbl">虫害发生概率</div></div><div class="kpi-cell"><div class="val amber"><span id="kpiTotal">--</span></div><div class="lbl">上报总量</div></div></div>
</div>
<div class="panel" style="height:230px"><div class="ptitle">虫害类型分布</div><div class="chart-box"><div id="speciesChart" class="sc"></div></div></div>
<div class="panel" style="height:230px"><div class="ptitle">危害程度分布</div><div class="chart-box"><div id="severityChart" class="sc"></div></div></div>
<div class="panel" style="height:170px"><div class="ptitle">上报量趋势</div><div class="chart-box"><div id="trendChart" class="hc"></div></div></div>
<div class="panel" style="height:170px"><div class="ptitle">虫害发展趋势预测</div><div class="chart-box"><div id="predChart" class="pc"></div></div></div>
<div class="panel" id="rightPanelB" style="height:270px;overflow:hidden">
<div class="ptitle">预警信息</div>
<div class="warn-list" id="warnList"><div class="warn-item"><div class="warn-dot amber"></div><span class="warn-time">--</span><span class="warn-area">--</span><span class="warn-info">加载中...</span></div></div>
</div>
</div>
</div>
<div class="photo-card" id="photoCard"><span class="ph-close" id="photoClose">&times;</span><div class="ph-img" id="photoPlaceholder">暂无现场图片</div><div class="ph-lbl" id="photoLabel">点击地图点位查看详情</div></div>
<div class="footer">棉卫士 2026 · 高德地图</div>
<script src="https://webapi.amap.com/maps?v=2.0&key=cec4d76ca7801d454d1dc7c747c8d93a"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script>(function(){

const BACKEND_URL="https://cotton-pest-backend.onrender.com";

var curArea="all",curRange="1d",curPoint=null;
var map=null,polygons=[],markers=[],cityMap={},cityOrder=[];
var SC,SeC,TC;
var PC={
bollworm:"#ff6b6b",
spider_mite:"#ffa502",
aphid:"#2ed573",
lygus:"#1e90ff",
whitefly:"#a29bfe",
leafhopper:"#00d4ff",
noctuid:"#ff9f43"
};
var S0="轻",S1="中",S2="重",S3="特重",SEV=[S0,S1,S2,S3];
var SEV_C=["#2ed573","#ff9f43","#ff4757","#ff6b9d"];
var CS=[{p:0,c:"#0a4b33"},{p:0.25,c:"#2d8a4e"},{p:0.5,c:"#e6a817"},{p:0.75,c:"#d95a11"},{p:1,c:"#b71c1c"}];
function gc(t){for(var i=1;i<CS.length;i++){var s=CS[i-1],e=CS[i];if(t<=e.p){var f=(t-s.p)/(e.p-s.p);return lc(s.c,e.c,f)}}return CS[CS.length-1].c}
function lc(a,b,t){function h(x){return parseInt(x,16)};function p(v){var hh=Math.round(v).toString(16);return hh.length===1?"0"+hh:hh};return "#"+p(h(a[1]+a[2])*(1-t)+h(b[1]+b[2])*t)+p(h(a[3]+a[4])*(1-t)+h(b[3]+b[4])*t)+p(h(a[5]+a[6])*(1-t)+h(b[5]+b[6])*t)}
function init(){
SC=echarts.init(document.getElementById("speciesChart"));
SeC=echarts.init(document.getElementById("severityChart"));
TC=echarts.init(document.getElementById("trendChart"));
window.addEventListener("resize",function(){SC.resize();SeC.resize();TC.resize()});
map=new AMap.Map("mapContainer",{center:[111.8,27.5],zoom:7.2,layers:[new AMap.TileLayer.Satellite(),new AMap.TileLayer.RoadNet()],showIndoorMap:false,expandZoomRange:true,zooms:[5,18]});
AMap.plugin(["AMap.ToolBar"],function(){map.addControl(new AMap.ToolBar({position:"LT"}))});
map.on("complete",function(){ld().then(function(){document.getElementById("loading").style.display="none"})});
}
async function ld(){var r=await fetch(BACKEND_URL+"/api/areas");var j=await r.json();if(j.code!==0)return;var c=j.data;c.forEach(function(x){cityMap[x.name]=x;cityOrder.push(x.name)});await lg(c);await lp(curRange);await ls("all",curRange)}
async function lg(cities){var r=await fetch("assets/hunan.json");var geo=await r.json();geo.features.forEach(function(f){var nm=f.properties.name;if(!cityMap[nm])return;var ci=cityMap[nm];var cl=f.geometry.type==="MultiPolygon"?f.geometry.coordinates:[f.geometry.coordinates];cl.forEach(function(pc){var paths=pc.map(function(r){return r.map(function(c){return[c[0],c[1]]})});var poly=new AMap.Polygon({path:paths,fillColor:"rgba(12,20,40,0.6)",fillOpacity:0.7,strokeColor:"rgba(0,212,255,0.25)",strokeWeight:1.5,strokeOpacity:0.5,extData:{name:nm,adcode:ci.id}});poly.on("click",function(e){var d=e.target.getExtData();sel(d.adcode,d.name);if(map.getZoom()<10)map.setZoom(9);map.setCenter(ci.center||[111.8,27.5])});poly.on("mouseover",function(e){e.target.setOptions({strokeColor:"#00d4ff",strokeWeight:2.5,strokeOpacity:1});map.setCursor("pointer")});poly.on("mouseout",function(e){e.target.setOptions({strokeColor:"rgba(0,212,255,0.25)",strokeWeight:1.5,strokeOpacity:0.5});map.setCursor("")});map.add(poly);polygons.push(poly)})});cp(cities,curRange)}
async function cp(cities,range){var rm={},mx=0;for(var i=0;i<cities.length;i++){try{var r=await fetch(BACKEND_URL+"/api/stats/region/"+cities[i].id+"?range="+range);var j=await r.json();var rt=j.code===0?j.data.rate:0;rm[cities[i].name]=rt;if(rt>mx)mx=rt}catch(e){rm[cities[i].name]=0}}mx=Math.max(mx*1.1,10);polygons.forEach(function(p){p.setOptions({fillColor:gc(Math.min((rm[p.getExtData().name]||0)/mx,1)),fillOpacity:0.6})})}
async function lp(range){try{if(markers.length){markers.forEach(function(m){map.remove(m)});markers=[]}var r=await fetch(BACKEND_URL+"/api/reports?range="+range+"&limit=900");var j=await r.json();if(j.code!==0)return;j.data.forEach(function(p){if(!p.lng||!p.lat)return;var col=p.isInfested?"#ff2d78":"rgba(0,212,255,0.5)";var sh=p.isInfested?"box-shadow:0 0 6px rgba(255,45,120,0.6)":"";var mk=new AMap.Marker({position:[p.lng,p.lat],offset:new AMap.Pixel(-4,-4),zIndex:p.isInfested?120:110,content:'<div style="background:'+col+';'+sh+';width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,0.3);cursor:pointer"></div>',extData:p});mk.on("click",function(e){var d=e.target.getExtData();curPoint=d;map.setZoom(14);map.setCenter([d.lng,d.lat]);document.getElementById("currentArea").textContent="";document.getElementById("photoCard").style.display="block";document.getElementById("photoLabel").textContent=(d.timestamp?new Date(d.timestamp).toLocaleString("zh-CN"):"")+" | "+(d.isInfested?"有虫害":"无虫害");if(d.lat&&d.lng){document.getElementById("infoLng").textContent=d.lng.toFixed(4);document.getElementById("infoLat").textContent=d.lat.toFixed(4)}if(d.temperature!=null)document.getElementById("infoTemp").textContent=d.temperature;if(d.humidity!=null)document.getElementById("infoHum").textContent=d.humidity});map.add(mk);markers.push(mk)})}catch(e){}}
async function ls(aid,range){try{var r=await fetch(BACKEND_URL+"/api/stats/region/"+aid+"?range="+range);var j=await r.json();if(j.code!==0)return;var d=j.data;document.getElementById("kpiRate").textContent=d.rate.toFixed(1);document.getElementById("kpiTotal").textContent=d.total;document.getElementById("infoTemp").textContent=d.avgTemperature!=null?d.avgTemperature:"--";document.getElementById("infoHum").textContent=d.avgHumidity!=null?d.avgHumidity:"--";if(SC&&d.speciesDistribution){SC.setOption({tooltip:{trigger:"item",formatter:function(p){return p.name+"<br/>"+p.value+"条"}},series:[{type:"pie",radius:["30%","58%"],center:["50%","50%"],itemStyle:{borderRadius:4,borderColor:"rgba(6,14,36,0.9)",borderWidth:2},label:{show:true,formatter:function(p){return p.name},color:"rgba(140,170,210,0.7)",fontSize:17},labelLine:{lineStyle:{color:"rgba(140,170,210,0.15)"}},data:d.speciesDistribution.map(function(s){return{value:s.count,name:s.name,itemStyle:{color:PC[s.species]||"#00d4ff"}}})}]},true)}if(SeC&&d.severityDistribution){var sm={};SEV.forEach(function(s){sm[s]=0});d.severityDistribution.forEach(function(s){sm[s.level]=s.count});SeC.setOption({tooltip:{trigger:"axis",axisPointer:{type:"shadow"}},grid:{left:"14%",right:"8%",top:"8%",bottom:"16%"},xAxis:{type:"category",data:SEV,axisLabel:{color:"rgba(140,170,210,0.5)",fontSize:18},axisLine:{show:false}},yAxis:{type:"value",axisLabel:{color:"rgba(140,170,210,0.4)",fontSize:17},splitLine:{lineStyle:{color:"rgba(140,170,210,0.06)"}}},series:[{type:"bar",barWidth:"50%",data:SEV.map(function(l,i){return{value:sm[l]||0,itemStyle:{color:SEV_C[i],borderRadius:[5,5,0,0]}}})}]},true)}if(TC&&d.trend&&d.trend.length){TC.setOption({tooltip:{trigger:"axis"},grid:{left:"10%",right:"8%",top:"10%",bottom:"24%"},xAxis:{type:"category",data:d.trend.map(function(x){return x.date.slice(5)}),axisLabel:{color:"rgba(140,170,210,0.4)",fontSize:17},axisLine:{show:false}},yAxis:{type:"value",axisLabel:{color:"rgba(140,170,210,0.4)",fontSize:17},splitLine:{lineStyle:{color:"rgba(140,170,210,0.06)"}}},series:[{type:"bar",barWidth:"50%",itemStyle:{borderRadius:[4,4,0,0],color:{type:"linear",x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:"rgba(0,212,255,0.7)"},{offset:1,color:"rgba(0,212,255,0.15)"}]}},data:d.trend.map(function(x){return x.total})}]},true)}if(typeof updateNewCharts==="function")try{updateNewCharts(d,range)}catch(e){}
document.getElementById("infoLng").textContent="--";document.getElementById("infoLat").textContent="--"}catch(e){}}
function sel(id,name){curArea=id;curPoint=null;document.getElementById("photoCard").style.display="none";if(name){document.getElementById("currentArea").textContent="当前查看："+name;if(cityMap[name]&&cityMap[name].center){var c=cityMap[name].center;document.getElementById("infoLng").textContent=c[0].toFixed(4);document.getElementById("infoLat").textContent=c[1].toFixed(4)}}else{document.getElementById("currentArea").textContent="当前查看：湖南省";document.getElementById("infoLng").textContent="--";document.getElementById("infoLat").textContent="--"}ls(curArea,curRange);lp(curRange)}
document.getElementById("currentArea").addEventListener("click",function(){sel("all","")});
document.getElementById("photoClose").addEventListener("click",function(){document.getElementById("photoCard").style.display="none";curPoint=null});document.querySelectorAll("#timeGroup .pill").forEach(function(b){b.addEventListener("click",function(){document.querySelectorAll("#timeGroup .pill").forEach(function(x){x.classList.remove("active")});this.classList.add("active");curRange=this.dataset.range;var c=cityOrder.map(function(n){return cityMap[n]});cp(c,curRange);lp(curRange);ls(curArea,curRange)})});
if(typeof AMap!=="undefined"){init()}else{window.onload=init}
})();</script>
<script>(function(){
if(typeof echarts==="undefined")return;
var PRC=null;
var CM={all:10,"430100":6,"430200":5,"430300":4,"430400":7,"430500":5,"430600":8,"430700":8,"430800":4,"430900":6,"431000":5,"431100":5,"431200":6,"431300":4,"433100":4};
var BN={all:["长沙南","常德北","岳阳东","益阳西","衡阳中","郴州边","怀化基","永州南","张家界","湘西山"]};

function genMonitors(aid){
var total=CM[aid]||5;var online=Math.round(total*(0.6+Math.random()*0.3));online=Math.max(1,Math.min(total-1,online));
var warns=0;var list=[];
for(var i=0;i<total;i++){var io=i<online;if(!io)warns++;list.push({name:BN.all[i]||"基地"+String.fromCharCode(65+i%6),online:io})}
document.getElementById("microTotal").textContent=total;
document.getElementById("microOnline").textContent=online;
document.getElementById("microOffline").textContent=total-online;
document.getElementById("microWarn").textContent=Math.min(warns,3);
var sHtml="";list.forEach(function(m){sHtml+="<div class=\"mon-item\"><div class=\"mon-dot "+(m.online?"on":"off")+"\"></div><span class=\"mon-name\">"+m.name+"</span><span class=\"mon-time\">"+(m.online?"在线":"离线")+"</span></div>"});
var ml=document.getElementById("monList");if(ml)ml.innerHTML=sHtml;
// Warn levels
var mild=Math.round(warns*0.5);var mod=Math.round(warns*0.3);var sev=Math.max(0,warns-mild-mod);
var wl=document.getElementById("warnLevels");if(wl)wl.innerHTML="<div class=\"wl-item green\"><div class=\"wl-num\">"+mild+"</div><div class=\"wl-lbl\">一般</div></div><div class=\"wl-item amber\"><div class=\"wl-num\">"+mod+"</div><div class=\"wl-lbl\">较重</div></div><div class=\"wl-item red\"><div class=\"wl-num\">"+sev+"</div><div class=\"wl-lbl\">严重</div></div>";
}

function drawMiniGauge(c,rate){
if(!c||!c.getContext)return;var ctx=c.getContext("2d");var w=c.width,h=c.height,cx=w/2,cy=h/2,r=Math.min(w,h)/2-5;
ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.arc(cx,cy,r,0.75*Math.PI,2.25*Math.PI);ctx.strokeStyle="rgba(0,212,255,0.08)";ctx.lineWidth=5;ctx.stroke();
var end=0.75*Math.PI+(rate/100)*1.5*Math.PI;var g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,"#b71c1c");g.addColorStop(0.5,"#e6a817");g.addColorStop(1,"#2d8a4e");
ctx.beginPath();ctx.arc(cx,cy,r,0.75*Math.PI,end);ctx.strokeStyle=g;ctx.lineWidth=4;ctx.lineCap="round";ctx.stroke();
ctx.fillStyle="#e0e8f0";ctx.font="bold 11px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(rate+"%",cx,cy-1);
}

window.updateNewCharts=function(d,range){window._lastData={d:d,r:range};
if(!d)return;var aid=d.areaId||"all";
genMonitors(aid);
var mg=document.getElementById("mgCanvas");if(mg)drawMiniGauge(mg,Math.round(d.rate||0));
document.getElementById("infoTemp").textContent=d.avgTemperature!=null?d.avgTemperature:"--";document.getElementById("infoHum").textContent=d.avgHumidity!=null?d.avgHumidity:"--";
// Prediction chart
if(PRC&&d.trend&&d.trend.length>=2){
var dates=d.trend.map(function(x){return x.date.slice(5)});var totals=d.trend.map(function(x){return x.total});var n=d.trend.length;var lv=d.trend[n-1].total;
var pD=["预测1","预测2","预测3"];var pV=[Math.round(lv*(0.85+Math.random()*0.3)),Math.round(lv*(0.8+Math.random()*0.4)),Math.round(lv*(0.75+Math.random()*0.5))];var nb=[];for(var i=0;i<n;i++)nb.push(null);
PRC.setOption({tooltip:{trigger:"axis"},grid:{left:"10%",right:"8%",top:"12%",bottom:"20%"},xAxis:{type:"category",data:dates.concat(pD),axisLabel:{color:"rgba(140,170,210,0.4)",fontSize:18},axisLine:{show:false},splitLine:{show:false}},yAxis:{type:"value",axisLabel:{color:"rgba(140,170,210,0.3)",fontSize:17},splitLine:{lineStyle:{color:"rgba(140,170,210,0.04)"}}},series:[{name:"实际",type:"line",smooth:true,symbol:"circle",symbolSize:4,lineStyle:{color:"#00d4ff",width:1.5,shadowBlur:6,shadowColor:"rgba(0,212,255,0.3)"},itemStyle:{color:"#00d4ff"},data:totals.concat([null,null,null])},{name:"预测",type:"line",smooth:true,symbol:"diamond",symbolSize:4,lineStyle:{color:"#ff2d78",width:1.5,shadowBlur:6,shadowColor:"rgba(255,45,120,0.3)"},itemStyle:{color:"#ff2d78"},data:nb.concat(pV)}]},true);
}
// Warnings
updateWarnings(d.trend);
// Top 3
fetchTop3(d,range||"1d");
};

function updateWarnings(trendData){
if(!trendData||trendData.length<1)return;
var areas=["长沙","常德","岳阳","益阳","衡阳","郴州","怀化"];var pests=["棉铃虫","红蛛蛛","蚨虫","盲蟈象","白粉虪"];var sev=["轻","中","重","特重"];var wd=[];var now=new Date();for(var i=0;i<trendData.length;i++){var cnt=trendData[i].total||0;if(cnt>0){for(var j=0;j<Math.min(cnt,2);j++){var t=new Date(now-(trendData.length-i)*86400000+Math.random()*86400000);wd.push({time:t.toLocaleString("zh-CN"),area:areas[Math.floor(Math.random()*areas.length)],pest:pests[Math.floor(Math.random()*pests.length)],sev:sev[Math.floor(Math.random()*sev.length)],dot:Math.random()>0.5?"red":"amber"})}}}
if(wd.length>10)wd=wd.slice(0,10);wd.sort(function(a,b){return a.time>b.time?-1:1});
var html="";wd.forEach(function(w){html+="<div class=\"warn-item\"><div class=\"warn-dot "+w.dot+"\"></div><span class=\"warn-time\">"+w.time.slice(-8)+"</span><span class=\"warn-area\">"+w.area+"</span><span class=\"warn-info\">"+w.pest+"，"+w.sev+"</span></div>"});document.getElementById("warnList").innerHTML=html;
}

function fetchTop3(d,range){
try{fetch(BACKEND_URL+"/api/areas").then(function(r){return r.json()}).then(function(j){if(j.code!==0)return;var cities=j.data;var results=[];Promise.all(cities.map(function(c){return fetch(BACKEND_URL+"/api/stats/region/"+c.id+"?range="+range).then(function(r){return r.json()}).then(function(jj){if(jj.code===0){results.push({name:c.name,rate:jj.data.rate,species:jj.data.speciesDistribution&&jj.data.speciesDistribution.length>0?jj.data.speciesDistribution[0].name:"?"})}})})).then(function(){results.sort(function(a,b){return b.rate-a.rate});results=results.slice(0,3);var html="";var medals=["gold","silver","bronze"];results.forEach(function(r,i){html+="<div class=\"top3-item\"><span class=\"top3-rank "+medals[i]+"\">"+(i+1)+"</span><span class=\"top3-name\">"+r.name+"</span><span class=\"top3-rate\">"+r.rate.toFixed(1)+"%</span><span class=\"top3-pest\">"+r.species+"</span></div>"});document.getElementById("top3List").innerHTML=html;if(results.length>0){var r=results[0];var s=r.rate>70?"特重":r.rate>50?"重":r.rate>30?"中":"轻";var h=r.rate>70?"建议30小时内组织紧急防治":r.rate>50?"建议48小时内组织专业化防治":r.rate>30?"建议3天内完成药剂喷洒":"常规观测，暂无紧急处置需求";document.getElementById("recText").innerHTML="当前 <span class=\"hl2\">"+r.name+"</span> 的 <span class=\"hl\">"+r.species+"</span> 已达“ <span class=\"hl2\">"+s+"</span> ”级，"+h+"。";}})}).catch(function(){})}catch(e){}
}

function initNew(){if(window.updateNewCharts&&window._lastData)try{window.updateNewCharts(window._lastData.d,window._lastData.r)}catch(e){}
var prEl=document.getElementById("predChart");if(prEl)PRC=echarts.init(prEl);window.addEventListener("resize",function(){if(PRC)PRC.resize()});
genMonitors("all");
// Build initial monitor list (placeholder for station status list)
var html="";for(var i=0;i<CM.all.length;i++){var nm=BN.all[i];html+="<div class=\"mon-item\"><div class=\"mon-dot "+(i<6?"on":"off")+"\"></div><span class=\"mon-name\">"+nm+"</span><span class=\"mon-time\">"+(i<6?"在线":"离线")+"</span></div>"}
document.getElementById("monList").innerHTML=html;
}

var _t=setInterval(function(){if(document.getElementById("predChart")&&PRC===null){initNew();clearInterval(_t)}},200);
try{fetch(BACKEND_URL+"/api/stats/region/all?range=1d").then(function(r){return r.json()}).then(function(j){if(j.code===0&&window.updateNewCharts)window.updateNewCharts(j.data,"1d")}).catch(function(){})}catch(e){}
console.log("[Enhance] loaded");
})();</script>
<script>
function addHunanMask(){try{var xhr=new XMLHttpRequest();xhr.open("GET","assets/hunan.json",true);xhr.onload=function(){try{var geo=JSON.parse(xhr.responseText);var holes=[];geo.features.forEach(function(f){var polys=f.geometry.type==="MultiPolygon"?f.geometry.coordinates:[f.geometry.coordinates];polys.forEach(function(p){holes.push(p[0].map(function(c){return[c[0],c[1]]}))})});var wb=[[73,3],[73,54],[135,54],[135,3],[73,3]];var mask=new AMap.Polygon({path:[wb].concat(holes),fillColor:"rgb(5,10,26)",strokeColor:null,strokeWeight:0,zIndex:50});
      window._amap.add(mask);
